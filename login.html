<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page - Fresh Version</title>
  <style>
    /* Body styling */
    body {
      font-family: 'Verdana', Geneva, Tahoma, sans-serif;
      background: #1c1c1c;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }

    /* Container styling */
    .login-container {
      background: #fefefe;
      padding: 35px 45px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      width: 350px;
      text-align: center;
      border-top: 6px solid #ff9800;
    }

    h2 {
      margin-bottom: 30px;
      font-size: 30px;
      color: #ff9800;
      font-weight: bold;
    }

    /* Input fields */
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 2px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #ff9800;
      outline: none;
    }

    input::placeholder {
      color: #999;
      font-style: italic;
    }

    /* Button styling */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #ff9800;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: #e68900;
      transform: scale(1.05);
    }

    /* Extra link */
    .forgot {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #555;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .forgot:hover {
      color: #ff9800;
    }

  </style>
</head>
<body>
  <div class="login-container">
    <h2>Welcome Back</h2>
    <form>
      <input type="text" id="username" placeholder="Enter your username" required>
      <input type="password" id="password" placeholder="Enter your password" required>
      <button type="submit">Sign In</button>
      <a href="#" class="forgot">Forgot Password?</a>
    </form>
  </div>
</body>
</html>
