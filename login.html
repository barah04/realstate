<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page - Maintenance Update</title>
  <style>
    /* Background and body styling */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }

    /* Container styling */
    .login-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      width: 320px;
      text-align: center;
    }

    h2 {
      margin-bottom: 25px;
      font-size: 28px;
      color: #fff;
      letter-spacing: 1px;
    }

    /* Input fields */
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      outline: none;
    }

    input[type="text"] {
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    input[type="password"] {
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    input::placeholder {
      color: #e0e0e0;
    }

    /* Button styling */
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    button:hover {
      background: #ff3b2f;
      transform: scale(1.05);
    }

  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form>
      <label for="username" class="sr-only">Username</label>
      <input type="text" id="username" placeholder="Username" required>

      <label for="password" class="sr-only">Password</label>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
